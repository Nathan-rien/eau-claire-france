<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche eau 1,5l - Carrefour</title>
</head>
<body>
    <div class="search-results">
        <article data-testid="product" class="product-card">
            <h3 data-testid="product-name">Evian Eau minérale naturelle 1,5L</h3>
            <div data-testid="price" class="price">0,89 €</div>
            <div data-testid="unit-price" class="unit-price">0,59 €/L</div>
            <button data-testid="add-to-cart" aria-label="Ajouter au panier">Ajouter</button>
            <a data-testid="product-link" href="/p/evian-eau-minerale-naturelle-1-5l-12345">Voir le produit</a>
            <img data-testid="product-image" src="/images/evian-1-5l.jpg" alt="Evian 1,5L">
            <div data-sku="12345">SKU: EVN-1.5L-001</div>
        </article>
        
        <article data-testid="product" class="product-card">
            <h3 data-testid="product-name">Cristaline Eau de source 1,5L</h3>
            <div data-testid="price" class="price">0,65 €</div>
            <div data-testid="unit-price" class="unit-price">0,43 €/L</div>
            <button data-testid="add-to-cart" aria-label="Ajouter au panier">Ajouter</button>
            <a data-testid="product-link" href="/p/cristaline-eau-de-source-1-5l-67890">Voir le produit</a>
            <img data-testid="product-image" src="/images/cristaline-1-5l.jpg" alt="Cristaline 1,5L">
            <div data-sku="67890">SKU: CRI-1.5L-001</div>
            <div data-testid="promotion" class="promo-badge">PROMO -20%</div>
        </article>
        
        <article data-testid="product" class="product-card">
            <h3 data-testid="product-name">Volvic Eau minérale naturelle 1,5L</h3>
            <div data-testid="price" class="price">0,95 €</div>
            <div data-testid="unit-price" class="unit-price">0,63 €/L</div>
            <button data-testid="add-to-cart" aria-label="Ajouter au panier">Ajouter</button>
            <a data-testid="product-link" href="/p/volvic-eau-minerale-naturelle-1-5l-54321">Voir le produit</a>
            <img data-testid="product-image" src="/images/volvic-1-5l.jpg" alt="Volvic 1,5L">
            <div data-sku="54321">SKU: VOL-1.5L-001</div>
        </article>
    </div>
    
    <nav class="pagination">
        <button data-testid="pagination-next" aria-label="Page suivante">Suivant</button>
    </nav>
</body>
</html>
